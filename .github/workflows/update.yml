name: 更新恶意网站数据

on:
  schedule:
    # 每 6 小时执行一次
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动触发
  push:
    branches:
      - main
    # 仅当采集脚本或工作流本身变更时触发；bot 提交 data/ 不会触发，避免循环
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 拉取恶意网站数据
        env:
          GSB_API_KEY: ${{ secrets.GSB_API_KEY }}
        run: node scripts/fetch-data.js

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: 更新恶意网站数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
